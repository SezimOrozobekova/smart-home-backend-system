version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: smarthouse-postgres
    restart: always
    environment:
      POSTGRES_DB: smarthouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - smarthouse_pgdata:/var/lib/postgresql/data

volumes:
  smarthouse_pgdata: