version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: smarthouse-postgres
    restart: always
    environment:
      POSTGRES_DB: smarthouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - smarthouse_pgdata:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    container_name: smarthouse-mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

volumes:
  smarthouse_pgdata: